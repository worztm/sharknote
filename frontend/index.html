<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🦈</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sharknote</title>
    <style>
      /* Splash: static HTML that paints on the very first frame — before any
         JS loads — so the window never shows a blank white/black period.
         React removes it with a fade once the app is actually mounted. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #09090b;
        transition: opacity 0.3s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
        box-shadow: 0 8px 40px -8px rgba(139, 92, 246, 0.55);
        animation: splashPop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3) both,
          splashPulse 2.2s ease-in-out 0.45s infinite;
      }
      .splash-name {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #fafafa;
        animation: splashPop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3) 0.1s both;
      }
      .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: rgba(139, 92, 246, 0.2);
        overflow: hidden;
        animation: splashPop 0.45s ease 0.15s both;
      }
      .splash-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #8b5cf6, #a78bfa);
        animation: splashSlide 1.1s ease-in-out infinite;
      }
      @keyframes splashPop {
        from {
          opacity: 0;
          transform: scale(0.85) translateY(6px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes splashPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }
      @keyframes splashSlide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <div class="splash-logo">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden>
          <path
            d="M12 2C7 6 4 10 4 14a8 8 0 0 0 16 0c0-4-3-8-8-12Z"
            fill="white"
            opacity="0.95"
          />
          <path
            d="M12 2C14.5 5.5 16 9 16 12.5A4 4 0 0 1 8 12.5C8 9 9.5 5.5 12 2Z"
            fill="url(#splashGrad)"
          />
          <path
            d="M9 14.5c1.5-1.2 3-1.2 4.5 0"
            stroke="#0b0b10"
            stroke-width="1.1"
            stroke-linecap="round"
          />
          <defs>
            <linearGradient id="splashGrad" x1="8" y1="2" x2="16" y2="16">
              <stop stop-color="#a78bfa" />
              <stop offset="1" stop-color="#7c3aed" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="splash-name">Sharknote</div>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
